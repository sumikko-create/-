<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>潜る</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="潜る">
<meta name="theme-color" content="#060F17">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --abyss:#060F17; --lumen:#8FDCC7; --sand:#E9E4D8; --amber:#E2A15E;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --sans:"Hiragino Sans","Noto Sans JP","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--abyss);color:var(--sand);font-family:var(--sans);overflow:hidden;
  transition:background-color 1.4s linear;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom))}
#halo{position:absolute;left:50%;top:50%;width:min(88vw,540px);aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.6);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(143,220,199,.20) 0%,rgba(143,220,199,.07) 42%,transparent 68%)}
#gauge{position:absolute;left:20px;top:23%;bottom:23%;width:2px;
  background:linear-gradient(to bottom,rgba(233,228,216,.05),rgba(233,228,216,.22))}
#marker{position:absolute;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--lumen);
  box-shadow:0 0 14px 3px rgba(143,220,199,.55);transition:top .9s cubic-bezier(.4,0,.5,1)}
#depthNum{position:absolute;left:36px;top:50%;transform:translateY(-50%);
  font:400 11px/1 var(--mono);color:rgba(143,220,199,.7);letter-spacing:.1em}

.view{flex:1;display:none;flex-direction:column;position:relative;z-index:2;min-height:0}
.view.on{display:flex}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:4px 0 12px}
h1{font-family:var(--mincho);font-size:clamp(38px,12vw,64px);font-weight:400;letter-spacing:.34em;text-indent:.34em}
.eyebrow{font:400 10px/1 var(--mono);letter-spacing:.4em;text-indent:.4em;color:rgba(143,220,199,.6);margin-bottom:22px}
.sub{margin-top:16px;font-size:12.5px;line-height:2;color:rgba(233,228,216,.5)}
.tiny{font-size:10.5px;line-height:1.9;color:rgba(233,228,216,.32)}
#line{font-family:var(--mincho);font-size:clamp(20px,5.4vw,29px);line-height:2.05;letter-spacing:.06em;
  max-width:19em;opacity:0;transition:opacity 1.1s ease}
#line.on{opacity:1}
#breath{margin-top:32px;font:400 11px/1 var(--mono);letter-spacing:.4em;text-indent:.4em;
  color:rgba(233,228,216,.4);min-height:11px}
#clock{font:200 clamp(62px,19vw,104px)/1 var(--mono);color:var(--amber)}

.field{margin:0 auto 20px;width:100%;max-width:340px;text-align:left}
.field label{display:block;font:400 10px/1 var(--mono);letter-spacing:.2em;color:rgba(233,228,216,.4);margin-bottom:9px}
.field input[type=text],.field select{width:100%;background:transparent;border:0;
  border-bottom:1px solid rgba(233,228,216,.22);color:var(--sand);font:400 16px/1.6 var(--mincho);
  padding:6px 2px;-webkit-appearance:none;appearance:none;border-radius:0}
.field select{font-family:var(--sans);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-bottom-color:var(--lumen)}
.field input::placeholder{color:rgba(233,228,216,.2)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;background:transparent;border:1px solid rgba(233,228,216,.2);border-radius:2px;
  color:rgba(233,228,216,.55);font:400 12px/1 var(--sans);letter-spacing:.1em;padding:12px 4px;cursor:pointer;
  transition:border-color .25s,color .25s,background-color .25s}
.seg button.sel{border-color:var(--lumen);color:var(--lumen);background:rgba(143,220,199,.07)}
.slider{display:flex;align-items:center;gap:10px;margin-top:14px}
.slider span{font:400 10px/1 var(--mono);letter-spacing:.12em;color:rgba(233,228,216,.4);width:34px;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:1px;background:rgba(233,228,216,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--lumen)}
input[type=checkbox]{accent-color:var(--lumen);width:13px;height:13px}

.btn{font:400 13px/1 var(--sans);letter-spacing:.22em;text-indent:.22em;color:var(--sand);background:transparent;
  border:1px solid rgba(233,228,216,.28);border-radius:2px;padding:15px 32px;cursor:pointer;
  transition:border-color .3s,color .3s}
.btn:hover,.btn:focus-visible{border-color:var(--lumen);color:var(--lumen)}
.btn:focus-visible{outline:2px solid var(--lumen);outline-offset:3px}
.btn.ghost{border-color:transparent;color:rgba(233,228,216,.38);padding:11px 14px;font-size:11px;letter-spacing:.14em}
.btn.ghost:hover{color:var(--sand)}
.btn.mini{padding:9px 14px;font-size:11px;letter-spacing:.1em;text-indent:.1em}
.btn.wide{width:100%;max-width:340px}
footer{display:flex;flex-direction:column;align-items:center;gap:13px;position:relative;z-index:3;padding-top:14px}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
label.ctl{display:flex;align-items:center;gap:8px;font:400 10px/1 var(--mono);letter-spacing:.14em;color:rgba(233,228,216,.4)}

#tapzone{position:absolute;inset:0;z-index:1;cursor:pointer}
#drift{font:400 11px/1.8 var(--mono);letter-spacing:.14em;color:rgba(226,161,94,.55);margin-top:24px;min-height:12px}
#anchorHint{position:absolute;bottom:24%;left:0;right:0;text-align:center;font-family:var(--mincho);
  font-size:14px;letter-spacing:.16em;color:rgba(226,161,94,.75);opacity:0;transition:opacity 1.4s ease;pointer-events:none}
#anchorHint.on{opacity:1}
.rate{display:flex;gap:9px;justify-content:center;margin:22px 0 6px}
.rate button{width:50px;height:50px;border-radius:50%;background:transparent;border:1px solid rgba(233,228,216,.22);
  color:rgba(233,228,216,.6);font:400 15px/1 var(--mono);cursor:pointer;transition:all .25s}
.rate button.sel{border-color:var(--amber);color:var(--amber);background:rgba(226,161,94,.1)}
.counter{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px}
.counter button{width:38px;height:38px;border-radius:50%;background:transparent;border:1px solid rgba(233,228,216,.22);
  color:rgba(233,228,216,.6);font:400 18px/1 var(--mono);cursor:pointer}
.counter b{font:400 15px/1 var(--mono);color:var(--sand);min-width:6em;text-align:center;font-weight:400}
.card{border:1px solid rgba(233,228,216,.12);border-radius:2px;padding:16px;margin:0 auto 14px;max-width:400px;width:100%}
.card h3{font:400 10px/1 var(--mono);letter-spacing:.24em;color:rgba(143,220,199,.6);margin-bottom:12px}
.card p{font-size:12.5px;line-height:1.95;color:rgba(233,228,216,.62)}
.card p em{font-style:normal;color:var(--lumen)}
.kv{display:flex;justify-content:space-between;font:400 11px/2.1 var(--mono);color:rgba(233,228,216,.5)}
.kv b{font-weight:400;color:var(--sand)}
svg.chart{width:100%;height:70px;display:block;margin-top:6px}
body.surfaced{background:#170F0A}
body.surfaced #halo{background:radial-gradient(circle,rgba(226,161,94,.14) 0%,rgba(226,161,94,.04) 45%,transparent 70%)}
body.surfaced .eyebrow{color:rgba(226,161,94,.6)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){#halo{transform:translate(-50%,-50%) scale(.85)!important}#marker{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="halo"></div>
  <div id="gauge" class="hidden"><div id="marker" style="top:0"></div></div>
  <div id="depthNum" class="hidden">0.0 m</div>

  <!-- 設定 -->
  <section class="view on" id="v-setup">
    <div class="mid" style="flex:0 0 auto;padding:18px 0 26px">
      <h1>潜る</h1>
      <p class="sub" id="setupSub">沈んで、暗示を置いて、勉強に入る。</p>
    </div>
    <div class="scroll">
      <div class="field">
        <label>今日やること</label>
        <input type="text" id="subject" placeholder="例：英単語 ターゲット 601-700" autocomplete="off">
      </div>
      <div class="field">
        <label>最初の一手（具体的に）</label>
        <input type="text" id="firstMove" placeholder="例：601から30個、音読しながら1周" autocomplete="off">
      </div>
      <div class="field">
        <label>声</label>
        <select id="voiceSel"></select>
        <div class="slider"><span>速さ</span><input type="range" id="rateR" min="55" max="105" value="76"></div>
        <div class="slider"><span>高さ</span><input type="range" id="pitchR" min="70" max="130" value="95"></div>
        <div class="row" style="margin-top:14px;justify-content:flex-start">
          <button class="btn mini" id="preview">試聴</button>
          <span class="tiny" id="voiceNote"></span>
        </div>
      </div>
      <div class="field">
        <label>誘導</label>
        <div class="seg" id="modeSeg">
          <button data-mode="full">フル 6分</button>
          <button data-mode="short">短縮 100秒</button>
          <button data-mode="instant">即時 25秒</button>
        </div>
      </div>
      <div class="field">
        <label>作業時間</label>
        <div class="seg" id="lenSeg">
          <button data-len="25">25分</button>
          <button data-len="45">45分</button>
          <button data-len="50">50分</button>
        </div>
      </div>
      <div class="card"><h3>いまの推奨</h3><p id="adviceText"></p></div>
    </div>
    <footer>
      <button class="btn wide" id="go">は じ め る</button>
      <div class="row">
        <button class="btn ghost" id="toLog">記録</button>
        <button class="btn ghost" id="toCalib">被暗示性テスト</button>
      </div>
      <p class="tiny" style="text-align:center">目を閉じて座った状態で。移動中・運転中・入浴中は使わない。</p>
    </footer>
  </section>

  <!-- 誘導 -->
  <section class="view" id="v-dive">
    <div class="mid">
      <div class="eyebrow" id="divePhase"></div>
      <div id="line"></div>
      <div id="breath"></div>
    </div>
    <footer>
      <div class="row">
        <button class="btn ghost" id="skipDive">誘導を飛ばす</button>
        <button class="btn ghost" id="abortDive">中断して上がる</button>
      </div>
      <label class="ctl">音量<input type="range" id="vol" min="0" max="100" value="40" style="width:90px"></label>
    </footer>
  </section>

  <!-- 作業 -->
  <section class="view" id="v-study">
    <div id="tapzone"></div>
    <div class="mid">
      <div class="eyebrow" id="studyTask"></div>
      <div id="clock">25:00</div>
      <div id="drift">このまま閉じてOK。戻ってくれば続きから<br>画面をタップ＝気が散った回数</div>
    </div>
    <div id="anchorHint">指を合わせて、ひとつ長く吐く</div>
    <footer><button class="btn ghost" id="endStudy" style="position:relative;z-index:4">終える</button></footer>
  </section>

  <!-- 記録 -->
  <section class="view" id="v-review">
    <div class="mid">
      <div class="eyebrow">記録</div>
      <p class="sub" style="margin:0">どのくらい入り込めた？</p>
      <div class="rate" id="rate">
        <button data-r="1">1</button><button data-r="2">2</button><button data-r="3">3</button>
        <button data-r="4">4</button><button data-r="5">5</button>
      </div>
      <div class="counter"><button id="xMinus">−</button><b id="xVal">気が散った 0 回</b><button id="xPlus">＋</button></div>
      <p class="tiny" id="reviewStat" style="margin-top:18px"></p>
    </div>
    <footer><button class="btn wide" id="saveReview">保 存</button></footer>
  </section>

  <!-- 履歴 -->
  <section class="view" id="v-log">
    <div class="scroll" id="logBody" style="padding-top:26px"></div>
    <footer><button class="btn wide" id="backFromLog">戻 る</button></footer>
  </section>

  <!-- 被暗示性テスト -->
  <section class="view" id="v-calib">
    <div class="mid">
      <div class="eyebrow">腕の重さテスト</div>
      <div id="calibLine" style="font-family:var(--mincho);font-size:clamp(19px,5vw,26px);line-height:2.1;max-width:19em"></div>
      <div class="rate hidden" id="calibRate">
        <button data-c="0">0</button><button data-c="3">3</button><button data-c="6">6</button>
        <button data-c="8">8</button><button data-c="10">10</button>
      </div>
      <p class="tiny hidden" id="calibHelp" style="margin-top:18px">0＝なにも感じない ／ 10＝腕が勝手に下がった</p>
    </div>
    <footer>
      <button class="btn wide" id="calibGo">は じ め る</button>
      <button class="btn ghost" id="calibBack">戻る</button>
    </footer>
  </section>
</div>

<script>
/* ════════ 保存 ════════ */
const KEY="dive:v3";
const DB={
  async load(){
    try{ if(window.storage){const r=await window.storage.get(KEY);return JSON.parse(r.value);} }catch(e){}
    try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  async save(o){
    const s=JSON.stringify(o);
    try{ if(window.storage){await window.storage.set(KEY,s);return;} }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};
let S={sessions:[],calib:null,lastSubject:"",lastMove:"",mode:"full",len:25,
       voiceURI:"",rate:76,pitch:95,vol:40,active:null};

/* ════════ 台本 ════════
   [秒, ラベル, 画面に出す文, 読み上げ用(省略可)]
   {S}=今日やること {M}=最初の一手 */
const FULL=[
 [0,  "導入","楽な姿勢で座って、目を閉じて。"],
 [12, "導入","これから六分だけ、勉強に入る準備をします。"],
 [25, "導入","呼吸を合わせていきます。ゆっくり吸って、少し止めて、長く吐く。"],
 [42, "導入","吐くときに、肩の力が抜けていきます。"],
 [56, "導入","おでこと、目のまわりを、ふっとゆるめます。"],
 [69, "導入","奥歯をゆるめて、首のうしろをほどきます。"],
 [83, "導入","肩が下がって、腕が重くなってきます。"],
 [97, "導入","背中、腰、太もも、ふくらはぎ。順番に、力を預けていきます。"],
 [113,"導入","体が椅子に沈んで、輪郭がぼやけていきます。"],
 [129,"導入","まわりの音は、どれも遠くで鳴っている感じ。"],
 [141,"導入","そのまま、もう少しだけ深く。"],
 [150,"深化","これから十から一まで数えます。ひとつ減るたびに、一段ずつ深くなります。"],
 [164,"深化","十、九、八。","じゅう。きゅう。はち。"],
 [176,"深化","七、六、五。深く、静かに。","なな。ろく。ご。深く、静かに。"],
 [188,"深化","四、三、二。","よん。さん。に。"],
 [199,"深化","一。いちばん深いところ。","いち。いちばん深いところ。"],
 [210,"暗示","今日やるのは、{S}。"],
 [220,"暗示","最初にやるのは、{M}。それだけです。"],
 [233,"暗示","画面を開くと、そこだけが明るく見えます。"],
 [245,"暗示","通知も、他のアプリも、ぜんぶ画面の外側に下がっていきます。"],
 [258,"暗示","指が他のアプリに伸びかけたら、そこで止めて、ひとつ長く吐く。それで戻れます。"],
 [274,"暗示","通知が出ても、読まなくていい。あとでまとめて見れば間に合います。"],
 [288,"暗示","集中は、がんばって掴むものじゃなくて、勝手に戻ってくるものです。"],
 [301,"錨","では、いまの状態に合図をつけます。"],
 [312,"錨","左手の親指と人差し指を、軽く合わせてください。"],
 [324,"錨","この静かさが、指先に結びつきます。"],
 [335,"錨","途中でもう一度合わせれば、ここに戻ってこられます。"],
 [347,"浮上","では、上がります。呼吸を少しずつ速くしていきます。"],
 [356,"浮上","一、二。体の感覚が戻ってきます。","いち。に。体の感覚が戻ってきます。"],
 [365,"浮上","三、四。肩を二回、回してください。","さん。よん。肩を、にかい、回してください。"],
 [375,"浮上","五。目を開けて。眠くはなくて、静かに冴えている感じ。","ご。目を開けて。眠くはなくて、静かに冴えている感じ。"],
 [385,"浮上","じゃあ、{M}から。"]
];
const SHORT=[
 [0, "再接続","目を閉じて。長く、三回だけ吐きます。"],
 [12,"再接続","一回目。肩が下がる。","いっかいめ。肩が下がる。"],
 [22,"再接続","二回目。あごがゆるむ。","にかいめ。あごがゆるむ。"],
 [32,"再接続","三回目。三、二、一で、あの深さに戻ります。","さんかいめ。さん、に、いちで、あの深さに戻ります。"],
 [45,"錨","左手の親指と人差し指を、合わせて。"],
 [55,"錨","同じ静かさが、指先から戻ってきます。"],
 [65,"暗示","今日は{S}。まずは{M}。それだけ。"],
 [78,"暗示","他のアプリに指が伸びたら、止めて、ひとつ吐く。"],
 [90,"浮上","肩を二回まわして、目を開けます。","肩を、にかい、まわして、目を開けます。"],
 [99,"浮上","じゃあ、{M}から。"]
];
const INSTANT=[
 [0, "即時","目を閉じて、指を合わせて。"],
 [7, "即時","長く、吐く。"],
 [14,"即時","{M}。それだけ。"],
 [21,"即時","目を開けて、はじめます。"]
];
const TOTALS={full:397,short:110,instant:28};

/* ════════ 状態 ════════ */
const $=id=>document.getElementById(id);
const VIEWS=["setup","dive","study","review","log","calib"];
function view(n){VIEWS.forEach(v=>$("v-"+v).classList.toggle("on",v===n));}
let mode="full",len=25,script=[],total=0,t0=0,raf=null,cue=0,phase="idle";
let driftCount=0,wake=null,voices=[],pendingRate=null,studyStart=null;
const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;
const BR={in:4,hold:2,out:6};

/* ── 音 ── */
let ac=null,master=null;
function audioInit(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=0;
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;
  master.connect(lp);lp.connect(ac.destination);
  [55,55.4,110.2].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine";o.frequency.value=f;g.gain.value=i===2?.18:.5;o.connect(g);g.connect(master);o.start();});
  const lfo=ac.createOscillator(),lg=ac.createGain();
  lfo.type="sine";lfo.frequency.value=.06;lg.gain.value=.035;lfo.connect(lg);lg.connect(master.gain);lfo.start();
  setVol();
}
function setVol(){ if(master)master.gain.setTargetAtTime($("vol").value/100*.16,ac.currentTime,.6); }
function audioFade(){ if(master)master.gain.setTargetAtTime(0,ac.currentTime,.8); }
$("vol").addEventListener("input",()=>{setVol();S.vol=+$("vol").value;DB.save(S);});

/* ── 声 ── */
function loadVoices(){
  voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  const sel=$("voiceSel"); sel.innerHTML="";
  if(!voices.length){
    sel.innerHTML='<option>日本語の音声が見つかりません</option>';
    $("voiceNote").textContent="設定 → アクセシビリティ → 読み上げコンテンツ → 声 で日本語を追加";
    return;
  }
  const nice=n=>n.replace(/\(.*?\)/g,"").trim();
  voices.forEach((v,i)=>{
    const o=document.createElement("option");
    o.value=v.voiceURI;
    o.textContent=nice(v.name)+(/enhanced|premium|拡張|高品質/i.test(v.name)?"（高品質）":"");
    sel.appendChild(o);
  });
  if(S.voiceURI&&voices.some(v=>v.voiceURI===S.voiceURI)) sel.value=S.voiceURI;
  else{
    const pref=voices.find(v=>/enhanced|premium|拡張/i.test(v.name))||voices.find(v=>/o-?ren|kyoko/i.test(v.name))||voices[0];
    sel.value=pref.voiceURI; S.voiceURI=pref.voiceURI;
  }
  $("voiceNote").textContent=voices.some(v=>/enhanced|premium|拡張/i.test(v.name))?"":"高品質版を入れると別物になる（下の説明）";
}
if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged",loadVoices);
loadVoices(); setTimeout(loadVoices,600);

function say(t){
  const u=new SpeechSynthesisUtterance(t);
  const v=voices.find(x=>x.voiceURI===$("voiceSel").value);
  if(v)u.voice=v;
  u.lang="ja-JP"; u.rate=+$("rateR").value/100; u.pitch=+$("pitchR").value/100;
  speechSynthesis.speak(u);
}
$("preview").addEventListener("click",()=>{
  speechSynthesis.cancel();
  say("楽な姿勢で座って、目を閉じて。これから、勉強に入る準備をします。");
});
["voiceSel","rateR","pitchR"].forEach(id=>$(id).addEventListener("change",()=>{
  S.voiceURI=$("voiceSel").value; S.rate=+$("rateR").value; S.pitch=+$("pitchR").value; DB.save(S);
}));
async function keepAwake(){ try{ wake=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&phase==="dive") keepAwake(); });

/* ════════ 誘導 ════════ */
function fill(t){ return t.replace(/\{S\}/g,S.lastSubject||"今日のぶん").replace(/\{M\}/g,S.lastMove||"最初の一問"); }
function build(m,deep){
  let raw = m==="full"?FULL : m==="short"?SHORT : INSTANT;
  if(m==="full"&&!deep){
    raw=raw.filter(r=>!(r[0]>=164&&r[0]<199)).map(r=>r[0]>=199?[r[0]-30,r[1],r[2],r[3]]:r);
  }
  return raw.map(r=>({at:r[0],p:r[1],t:r[2],s:r[3]}));
}
async function startDive(){
  audioInit(); if(ac.state==="suspended")await ac.resume();
  keepAwake();
  const deep=S.calib===null||S.calib>=4;
  script=build(mode,deep);
  total=mode==="full"?(deep?TOTALS.full:TOTALS.full-30):TOTALS[mode];
  cue=0;t0=performance.now();phase="dive";
  view("dive"); document.body.classList.remove("surfaced");
  if(mode==="full"){$("gauge").classList.remove("hidden");$("depthNum").classList.remove("hidden");}
  loop();
}
function showLine(c){
  const el=$("line"); el.classList.remove("on");
  setTimeout(()=>{el.textContent=fill(c.t);el.classList.add("on");},reduced?0:280);
  $("divePhase").textContent=c.p; say(fill(c.s||c.t));
}
function depthAt(s){
  const a=total*.53,b=total*.88;
  if(s<=a)return 10*s/a;
  if(s<=b)return 10;
  return 10*Math.max(0,1-(s-b)/(total-b));
}
function breathAt(s){
  const cyc=BR.in+BR.hold+BR.out,x=s%cyc;
  if(x<BR.in)return{l:"吸 う",k:x/BR.in};
  if(x<BR.in+BR.hold)return{l:"止 め る",k:1};
  return{l:"吐 く",k:1-(x-BR.in-BR.hold)/BR.out};
}
function loop(){
  raf=requestAnimationFrame(loop);
  if(phase==="dive"){
    const s=(performance.now()-t0)/1000;
    while(cue<script.length&&s>=script[cue].at) showLine(script[cue++]);
    const b=breathAt(s);
    $("breath").textContent=b.l;
    if(!reduced)$("halo").style.transform=`translate(-50%,-50%) scale(${.55+b.k*.45})`;
    if(mode==="full"){
      const d=depthAt(s);
      $("marker").style.top=(d/10*100)+"%";
      $("depthNum").textContent=d.toFixed(1)+" m";
      $("app").style.background=`linear-gradient(180deg,rgba(23,80,95,${.30-d/10*.26}) 0%,rgba(6,15,23,1) ${60-d/10*25}%)`;
    }
    if(s>=total+8) toStudy();
  }
  if(phase==="study"){
    const s=(Date.now()-studyStart)/1000;
    const left=Math.max(0,len*60-s);
    $("clock").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(Math.floor(left%60)).padStart(2,"0");
    if(!reduced)$("halo").style.transform=`translate(-50%,-50%) scale(${.8+Math.sin(s/9)*.05})`;
    if(Math.floor(s)%300===0&&Math.floor(s)>60&&Math.floor(s)!==Math.floor(s-.05)){
      $("anchorHint").classList.add("on"); setTimeout(()=>$("anchorHint").classList.remove("on"),7000);
    }
    if(left<=0) toReview(true);
  }
}
function toStudy(){
  speechSynthesis.cancel();
  phase="study"; studyStart=Date.now(); driftCount=0;
  S.active={start:studyStart,len,mode,x:0}; DB.save(S);
  document.body.classList.add("surfaced"); $("app").style.background="";
  $("gauge").classList.add("hidden"); $("depthNum").classList.add("hidden");
  $("studyTask").textContent=(S.lastMove||"はじめる").slice(0,22);
  $("drift").innerHTML="このまま閉じてOK。戻ってくれば続きから<br>画面をタップ＝気が散った回数";
  view("study");
  if(!raf) loop();
}
$("tapzone").addEventListener("click",()=>{
  if(phase!=="study")return;
  driftCount++;
  if(S.active){S.active.x=driftCount;DB.save(S);}
  $("drift").innerHTML="気が散った "+driftCount+" 回<br>指を合わせて、ひとつ長く吐く";
  if(navigator.vibrate)navigator.vibrate(12);
});
function toReview(auto){
  if(auto) say("時間です。いちど立ち上がって、体を伸ばしてください。");
  cancelAnimationFrame(raf); raf=null; phase="review";
  const mins=Math.min(len,Math.round((Date.now()-studyStart)/60000));
  $("reviewStat").textContent=mins+"分やった";
  pendingRate=null; updX();
  document.querySelectorAll("#rate button").forEach(b=>b.classList.remove("sel"));
  view("review");
}
function updX(){ $("xVal").textContent="気が散った "+driftCount+" 回"; }
$("xMinus").addEventListener("click",()=>{driftCount=Math.max(0,driftCount-1);updX();});
$("xPlus").addEventListener("click",()=>{driftCount++;updX();});

/* ════════ 記録・分析 ════════ */
async function saveSession(){
  if(pendingRate===null){
    $("saveReview").textContent="1〜5 を選ぶ";
    setTimeout(()=>$("saveReview").textContent="保 存",1600); return;
  }
  S.sessions.push({d:Date.now(),h:new Date(studyStart||Date.now()).getHours(),
    m:mode,len,r:pendingRate,x:driftCount});
  S.sessions=S.sessions.slice(-120); S.active=null;
  await DB.save(S);
  audioFade(); if(wake&&wake.release)wake.release(); wake=null; phase="idle";
  document.body.classList.remove("surfaced");
  $("halo").style.transform="translate(-50%,-50%) scale(.6)";
  refreshHome(); view("setup");
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function analyse(){
  const s=S.sessions,n=s.length,out=[];
  if(n<5){ out.push(`記録が ${n}/5 回。まず同じ時間帯に5回、フルで回す。効き目の判定はそれから。`); return out; }
  const full=s.filter(x=>x.m==="full"),sh=s.filter(x=>x.m==="short"),last3=s.slice(-3);
  if(mode!=="short"&&last3.length===3&&last3.every(x=>x.r>=4&&x.m==="full"))
    out.push("3回続けて4以上。<em>短縮100秒</em>に移していい頃。短いほど毎日続く。");
  if(sh.length>=3&&avg(sh.slice(-3).map(x=>x.r))<3&&avg(full.map(x=>x.r))>=3.5)
    out.push("短縮だと落ちてる。<em>週に1回はフル</em>を挟んで錨を打ち直す。");
  const byH={}; s.forEach(x=>{(byH[x.h]=byH[x.h]||[]).push(x.r);});
  const hs=Object.entries(byH).filter(([,v])=>v.length>=3).sort((a,b)=>avg(b[1])-avg(a[1]));
  if(hs.length>=2) out.push(`いちばん入り込めてるのは <em>${hs[0][0]}時台</em>（平均${avg(hs[0][1]).toFixed(1)}）、悪いのは ${hs[hs.length-1][0]}時台。寄せられるなら前者に。`);
  const rx=avg(s.slice(-5).map(x=>x.x));
  if(rx>=6) out.push(`直近5回の中断が平均${rx.toFixed(1)}回。作業時間を<em>25分</em>に落とすか、通知を集中モードで切る。`);
  const l45=s.filter(x=>x.len>=45),l25=s.filter(x=>x.len===25);
  if(l45.length>=3&&l25.length>=3){
    const d=avg(l45.map(x=>x.r))-avg(l25.map(x=>x.r));
    if(Math.abs(d)>=.5) out.push(`${d>0?"45分以上":"25分"}のほうが平均${Math.abs(d).toFixed(1)}高い。そっちに固定。`);
  }
  if(S.calib!==null&&S.calib<=3) out.push("被暗示性は低めに出てる。深い誘導より<em>手順の固定と if-then</em>が効くタイプ。短縮中心でいい。");
  if(!out.length) out.push("いまの組み合わせで安定してる。変えずに続ける。");
  return out;
}
function refreshHome(){
  $("adviceText").innerHTML=analyse().join("<br><br>");
  $("setupSub").textContent=S.sessions.length
    ? `通算 ${S.sessions.length} 回 ／ 平均 ${avg(S.sessions.map(x=>x.r)).toFixed(1)}`
    : "沈んで、暗示を置いて、勉強に入る。";
}
function renderLog(){
  const s=S.sessions.slice(-14),b=$("logBody");
  if(!S.sessions.length){b.innerHTML='<p class="tiny" style="text-align:center">まだ記録がない。</p>';return;}
  const w=100/Math.max(s.length,1);
  const bars=s.map((x,i)=>{
    const h=x.r/5*54,c=x.m==="full"?"#8FDCC7":x.m==="short"?"#E2A15E":"#C46A4A";
    return `<rect x="${i*w+w*.18}%" y="${60-h}" width="${w*.64}%" height="${h}" fill="${c}" opacity=".8"/>`;
  }).join("");
  const a=S.sessions;
  b.innerHTML=`
  <div class="card"><h3>直近14回の集中度</h3>
    <svg class="chart" viewBox="0 0 100 70" preserveAspectRatio="none">${bars}
      <line x1="0" y1="60" x2="100" y2="60" stroke="rgba(233,228,216,.2)" stroke-width=".4"/></svg>
    <p class="tiny" style="margin-top:8px">緑＝フル ／ 橙＝短縮 ／ 赤＝即時</p></div>
  <div class="card"><h3>集計</h3>
    <div class="kv"><span>セッション</span><b>${a.length}</b></div>
    <div class="kv"><span>平均集中度</span><b>${avg(a.map(x=>x.r)).toFixed(2)}</b></div>
    <div class="kv"><span>平均中断</span><b>${avg(a.map(x=>x.x)).toFixed(1)} 回</b></div>
    <div class="kv"><span>合計</span><b>${Math.round(a.reduce((s2,x)=>s2+x.len,0)/60)} 時間</b></div>
    <div class="kv"><span>被暗示性</span><b>${S.calib===null?"未測定":S.calib+" / 10"}</b></div></div>
  <div class="card"><h3>分析</h3><p>${analyse().join("<br><br>")}</p></div>
  <div class="card"><h3>声を良くする</h3><p>設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 日本語 で、Kyoko や O-ren の<em>高品質版</em>をダウンロードすると、同じ名前の声でも聞こえ方がかなり変わる。入れたあとにこのアプリを開き直すと選べるようになる。</p></div>`;
}

/* ════════ 被暗示性テスト ════════ */
const CAL=[
 [0,"左腕をまっすぐ前に伸ばして、手のひらを上に向けます。目は閉じたまま。"],
 [11,"その手のひらに、分厚い辞書が置かれるのを想像してください。"],
 [22,"重い。ずっしり重い。腕がすこしずつ下がっていきます。"],
 [34,"さらに二冊、重ねられます。腕が耐えられなくなっていきます。"],
 [46,"重い、重い、どんどん下がる。"],
 [56,"はい、終わり。目を開けて、腕を下ろしてください。"]
];
let calT=null;
$("calibGo").addEventListener("click",()=>{
  $("calibGo").classList.add("hidden"); audioInit();
  let i=0; const t=performance.now();
  const tick=()=>{
    const s=(performance.now()-t)/1000;
    while(i<CAL.length&&s>=CAL[i][0]){$("calibLine").textContent=CAL[i][1];say(CAL[i][1]);i++;}
    if(s<64) calT=requestAnimationFrame(tick);
    else{$("calibLine").textContent="腕はどれくらい下がった？";
      $("calibRate").classList.remove("hidden");$("calibHelp").classList.remove("hidden");}
  };
  tick();
});
$("calibRate").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b)return;
  S.calib=+b.dataset.c; await DB.save(S); refreshHome(); resetCalib(); view("setup");
});
function resetCalib(){
  cancelAnimationFrame(calT); speechSynthesis.cancel();
  $("calibGo").classList.remove("hidden");
  $("calibRate").classList.add("hidden"); $("calibHelp").classList.add("hidden");
  $("calibLine").textContent="腕が重くなる感じを試して、誘導の深さを自動で調整する。1分。";
}

/* ════════ 遷移 ════════ */
function seg(id,attr,cb){
  $(id).addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    $(id).querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); cb(b.dataset[attr]);
  });
}
seg("modeSeg","mode",v=>{mode=v;S.mode=v;DB.save(S);});
seg("lenSeg","len",v=>{len=+v;S.len=+v;DB.save(S);});
$("rate").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#rate button").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel"); pendingRate=+b.dataset.r;
});
$("go").addEventListener("click",async()=>{
  S.lastSubject=$("subject").value.trim(); S.lastMove=$("firstMove").value.trim();
  await DB.save(S); startDive();
});
$("skipDive").addEventListener("click",()=>{speechSynthesis.cancel();toStudy();});
$("abortDive").addEventListener("click",()=>{
  speechSynthesis.cancel();
  say("三つ数えて上がります。いち、に、さん。目を開けてください。");
  setTimeout(()=>{cancelAnimationFrame(raf);raf=null;phase="idle";audioFade();
    document.body.classList.remove("surfaced");$("app").style.background="";
    $("gauge").classList.add("hidden");$("depthNum").classList.add("hidden");view("setup");},4600);
});
$("endStudy").addEventListener("click",()=>toReview(false));
$("saveReview").addEventListener("click",saveSession);
$("toLog").addEventListener("click",()=>{renderLog();view("log");});
$("backFromLog").addEventListener("click",()=>view("setup"));
$("toCalib").addEventListener("click",()=>{resetCalib();view("calib");});
$("calibBack").addEventListener("click",()=>{resetCalib();view("setup");});

/* ════════ 起動 ════════ */
(async()=>{
  const saved=await DB.load(); if(saved)S={...S,...saved};
  mode=S.mode||"full"; len=S.len||25;
  $("subject").value=S.lastSubject||""; $("firstMove").value=S.lastMove||"";
  $("rateR").value=S.rate||76; $("pitchR").value=S.pitch||95; $("vol").value=S.vol||40;
  document.querySelector(`#modeSeg [data-mode="${mode}"]`)?.classList.add("sel");
  document.querySelector(`#lenSeg [data-len="${len}"]`)?.classList.add("sel");
  loadVoices(); resetCalib(); refreshHome();

  // 作業中にアプリを閉じていた場合は続きから
  if(S.active){
    const el=(Date.now()-S.active.start)/1000;
    len=S.active.len; mode=S.active.mode; driftCount=S.active.x||0;
    studyStart=S.active.start;
    if(el < len*60){
      phase="study"; document.body.classList.add("surfaced");
      $("studyTask").textContent=(S.lastMove||"つづき").slice(0,22);
      $("drift").innerHTML="つづきから。画面をタップ＝気が散った回数";
      view("study"); loop();
    }else{
      toReview(false);
    }
  }
})();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
